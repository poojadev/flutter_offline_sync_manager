name: flutter_offline_sync_manager
description: A production-grade Flutter package for managing offline sync operations with crash-safety, restart-safety, and duplication-safety. Works with any backend (REST, Firebase, GraphQL).
version: 0.1.0
homepage: https://github.com/poojadev/flutter_offline_sync_manager
repository: https://github.com/poojadev/flutter_offline_sync_manager
issue_tracker: https://github.com/poojadev/flutter_offline_sync_manager/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

topics:
    - offline
    - sync
    - offline-first
    - background-sync
    - conflict-resolution


dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  connectivity_plus: ^5.0.2
  workmanager: ^0.5.2
  background_fetch: ^1.5.0
  path_provider: ^2.1.1
  http: ^1.1.0
  cloud_firestore: ^4.13.6

dev_dependencies:
  flutter_test:
    sdk: flutter

